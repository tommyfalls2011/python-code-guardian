[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguardian"
version = "1.0.1"
description = "Python static analysis and guarded repair system"
requires-python = ">=3.10"

[project.scripts]
codeguardian = "codeguardian.cli:main"

[tool.setuptools.packages.find]
include = ["codeguardian*"]
